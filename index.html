<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WvH Schulchor | Vorführversion</title><style>
:root{--green:#173f35;--gold:#d6b66c;--cream:#f7f5ed;--ink:#243d34}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,Arial,sans-serif}header{background:var(--green);color:#fff;padding:32px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}header h1{font:normal 38px Georgia,serif;margin:0}header p{margin:8px 0;color:#e9dfc5}.notes{font-size:48px;color:var(--gold)}.layout{display:grid;grid-template-columns:225px 1fr;min-height:75vh}aside{background:#eaece4;padding:24px 12px;border-right:1px solid #d7ddd2}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:13px 16px;color:var(--ink);cursor:pointer;font-size:15px}nav button.active,nav button:hover{background:var(--green);color:white}main{padding:30px;max-width:1150px;width:100%}h2{font:normal 32px Georgia,serif;margin:0 0 12px}h3{font:normal 23px Georgia,serif}.muted{color:#69786f}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:25px 0}.card,.panel{background:white;border:1px solid #e1e4dc;border-radius:12px;padding:20px;box-shadow:0 3px 12px #163a2e0a}.card strong{display:block;font-size:29px;color:var(--green)}.panel{margin:16px 0}.primary,button.action{background:var(--green);color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer}.secondary{background:white;border:1px solid #b7c4b9;border-radius:7px;padding:10px 14px;color:var(--green);cursor:pointer}input,select,textarea{padding:10px;border:1px solid #bccac0;border-radius:7px;max-width:100%;font:inherit}input[type=range]{width:100%}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}.item{padding:15px 0;border-bottom:1px solid #e7e9e3}.item:last-child{border:0}.tag{font-size:12px;background:#edf3ed;color:#38634b;padding:4px 9px;border-radius:30px}.warning{background:#fff7df;padding:12px;border-radius:8px;margin:18px 0;color:#705a24}audio{max-width:100%}footer{padding:15px 5%;color:#65766b;font-size:12px}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{padding:8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{padding:20px}header h1{font-size:29px}.notes{display:none}}</style></head><body>
<header><div><div style="color:var(--gold);letter-spacing:3px;font-size:12px">WILHELM-VON-HUMBOLDT-SCHULE</div><h1>Unser Schulchor</h1><p>Gemeinsam singen. Auch wenn wir nicht im selben Raum sind.</p></div><div class="notes">♫ ♪ ♬</div></header><div class="layout"><aside><nav id="nav"></nav><p class="muted" style="font-size:12px;padding:14px">Lokale Vorführversion · ohne echte Anmeldung</p></aside><main><div class="row" style="justify-content:flex-end"><label>Ansicht: <select id="role"><option value="teacher">Frau Nolte (Lehrkraft)</option><option value="student">Schüler/in</option></select></label></div><div id="view"></div></main></div><footer>WvH Schulchor · Technischer Prototyp · Keine echten Schülerdaten verwenden</footer>
<script>
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const store=(k,v)=>localStorage.setItem('wvh_'+k,JSON.stringify(v));const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('wvh_'+k))??d}catch{return d}};let projects=load('projects',[{id:1,name:'Gemeinsam klingt es schön',group:'Schulchor',desc:'Unser erstes gemeinsames Chorprojekt'}]);let recordings=[];let active='dashboard';let recorder,stream,chunks=[];let context,playing=[];
const menus=[['dashboard','Übersicht'],['projects','Chorprojekte'],['groups','Gruppen'],['record','Aufnehmen'],['submissions','Abgaben'],['listening','Hörraum'],['studio','Tonstudio'],['messages','Nachrichten']];
function render(){const teacher=$('role').value==='teacher';$('nav').innerHTML=menus.map(([id,t])=>`<button class="${active===id?'active':''}" data-page="${id}">${t}</button>`).join('');let html='';if(active==='dashboard'){html=`<h2>Willkommen ${teacher?'zurück, Frau Nolte':'im Schulchor'}!</h2><p class="muted">Hier entsteht unser gemeinsamer virtueller Chorraum.</p><div class="cards"><div class="card"><strong>${projects.length}</strong>Chorprojekte</div><div class="card"><strong>${recordings.length}</strong>Aufnahmen in dieser Sitzung</div><div class="card"><strong>1</strong>Chorgruppe</div></div><div class="panel"><h3>Als Nächstes</h3><p>Öffne ein Chorprojekt, probiere eine Aufnahme aus und mische sie anschließend im Tonstudio.</p><button class="primary" data-go="projects">Projekte ansehen</button></div>`}
if(active==='projects'){html=`<h2>Chorprojekte</h2><p class="muted">Lieder und Aufgaben für unseren Schulchor.</p>${teacher?'<div class="panel"><h3>Neues Projekt</h3><form id="projectForm"><div class="row"><input name="name" placeholder="Titel des Liedes" required><input name="group" placeholder="Gruppe" value="Schulchor"><button class="primary">Projekt anlegen</button></div><textarea name="desc" placeholder="Beschreibung" rows="2"></textarea></form></div>':''}<div class="panel">${projects.map(p=>`<div class="item"><h3>${escapeHTML(p.name)}</h3><p>${escapeHTML(p.desc||'')}</p><span class="tag">${escapeHTML(p.group)}</span> <button class="secondary" data-go="record">Stimme aufnehmen</button></div>`).join('')}</div>`}
if(active==='groups'){html='<h2>Gruppen</h2><div class="panel"><h3>Schulchor</h3><p>Hier werden später die Schülergruppen aus dem Schulkonto verwaltet.</p><span class="tag">Demo-Gruppe</span></div>'}
if(active==='record'){html=`<h2>Deine Stimme aufnehmen</h2><p>Wähle ein Projekt und erlaube dem Browser die Mikrofonbenutzung.</p><div class="panel"><label>Projekt <select id="recProject">${projects.map(p=>`<option value="${p.id}">${escapeHTML(p.name)}</option>`).join('')}</select></label><div class="row"><button class="primary" id="startRec">● Aufnahme starten</button><button class="secondary" id="stopRec" disabled>■ Aufnahme stoppen</button></div><p id="recStatus" class="muted">Bereit für die Aufnahme.</p><div id="preview"></div></div><div class="warning">Mikrofonaufnahmen funktionieren nur in unterstützten Browsern mit sicherem Ursprung (HTTPS oder localhost). Aufnahmen bleiben in dieser Vorführung nur während der geöffneten Sitzung erhalten.</div>`}
if(active==='submissions'){html=`<h2>Abgaben</h2><p class="muted">Aufnahmen dieser Sitzung</p><div class="panel">${recordings.length?recordings.map((r,i)=>`<div class="item"><b>${escapeHTML(r.name)}</b> · ${escapeHTML(r.project)} <span class="tag">${r.approved?'Freigegeben':'Zur Prüfung'}</span><div class="row"><audio controls src="${r.url}"></audio>${teacher?`<button class="secondary" data-approve="${i}">${r.approved?'Freigabe zurücknehmen':'Freigeben'}</button>`:''}</div></div>`).join(''):'Noch keine Aufnahmen vorhanden. Öffne „Aufnehmen“, um eine Stimme einzusingen.'}</div>`}
if(active==='listening'){let approved=recordings.filter(r=>r.approved);html=`<h2>Hörraum</h2><p class="muted">Hier sind freigegebene Stimmen zu hören.</p><div class="panel">${approved.length?approved.map(r=>`<div class="item">${escapeHTML(r.name)} · ${escapeHTML(r.project)}<br><audio controls src="${r.url}"></audio></div>`).join(''):'Noch keine freigegebenen Aufnahmen.'}</div>`}
if(active==='studio'){html=`<h2>Tonstudio</h2><p class="muted">Stimmen gemeinsam anhören und ihre Lautstärke anpassen.</p><div class="panel"><h3>Mehrspur-Mischpult</h3>${recordings.length?recordings.map((r,i)=>`<div class="item"><label>${escapeHTML(r.name)} · ${escapeHTML(r.project)}</label><div class="row"><input aria-label="Lautstärke" type="range" min="0" max="100" value="75" data-volume="${i}"><span id="vol${i}">75 %</span></div></div>`).join(''):'Noch keine aufgenommenen Stimmen. Nimm zuerst eine oder mehrere Stimmen auf.'}<div class="row"><button class="primary" id="playMix" ${recordings.length?'':'disabled'}>▶ Zusammen abspielen</button><button class="secondary" id="stopMix">■ Stopp</button></div></div><div class="warning">Dies ist ein einfacher Mehrspur-Player, keine automatische Synchronisierung oder professionelle Audiobearbeitung.</div>`}
if(active==='messages'){html='<h2>Nachrichten</h2><div class="panel"><h3>Willkommen im Chorraum!</h3><p>Hier werden später Mitteilungen der Chorleitung angezeigt.</p></div>'} $('view').innerHTML=html;bind()}
function bind(){document.querySelectorAll('[data-page],[data-go]').forEach(b=>b.onclick=()=>{stopMix();active=b.dataset.page||b.dataset.go;render()});if($('projectForm'))$('projectForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);projects.push({id:Date.now(),name:d.get('name').trim(),group:d.get('group')||'Schulchor',desc:d.get('desc')});store('projects',projects);render()};if($('startRec'))$('startRec').onclick=startRec;if($('stopRec'))$('stopRec').onclick=stopRec;document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{recordings[+b.dataset.approve].approved=!recordings[+b.dataset.approve].approved;render()});document.querySelectorAll('[data-volume]').forEach(b=>b.oninput=()=>{$('vol'+b.dataset.volume).textContent=b.value+' %'});if($('playMix'))$('playMix').onclick=playMix;if($('stopMix'))$('stopMix').onclick=stopMix}
async function startRec(){try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Mikrofonaufnahme wird hier nicht unterstützt.');stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});let p=projects.find(p=>String(p.id)===$('recProject')?.value)||projects[0];let url=URL.createObjectURL(blob);recordings.push({name:'Meine Stimme '+(recordings.length+1),project:p?.name||'Schulchor',url,blob,approved:false});if($('preview'))$('preview').innerHTML='<p>Aufnahme gespeichert (nur in dieser Sitzung). Im Menü „Abgaben“ kannst du sie anhören.</p><audio controls src="'+url+'"></audio>';stream.getTracks().forEach(t=>t.stop())};recorder.start();$('startRec').disabled=true;$('stopRec').disabled=false;$('recStatus').textContent='Aufnahme läuft … sing jetzt!'}catch(e){$('recStatus').textContent='Fehler: '+e.message}}
function stopRec(){if(recorder?.state==='recording'){recorder.stop();$('stopRec').disabled=true;$('startRec').disabled=false;$('recStatus').textContent='Aufnahme beendet.'}}
function stopMix(){playing.forEach(x=>{try{x.stop?.();x.pause?.()}catch{}});playing=[]}
async function playMix(){stopMix();if(!recordings.length)return;try{context=context||new (window.AudioContext||window.webkitAudioContext)();await context.resume();let buffers=await Promise.all(recordings.map(async r=>context.decodeAudioData((await r.blob.arrayBuffer()).slice(0))));let start=context.currentTime+.15;buffers.forEach((buffer,i)=>{let src=context.createBufferSource(),gain=context.createGain();src.buffer=buffer;gain.gain.value=(Number(document.querySelector('[data-volume="'+i+'"]').value)||0)/100;src.connect(gain).connect(context.destination);src.start(start);playing.push(src)})}catch(e){alert('Mischen nicht möglich: '+e.message)}}
$('role').onchange=render;render();
</script></body></html>
