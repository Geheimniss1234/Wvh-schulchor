<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WvH Schulchor | Winter Wonderland Test</title><style>
:root{--green:#173f35;--gold:#d6b66c;--cream:#f7f5ed;--ink:#243d34}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,Arial,sans-serif}header{background:var(--green);color:#fff;padding:32px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}header h1{font:normal 38px Georgia,serif;margin:0}header p{margin:8px 0;color:#e9dfc5}.notes{font-size:48px;color:var(--gold)}.layout{display:grid;grid-template-columns:225px 1fr;min-height:75vh}aside{background:#eaece4;padding:24px 12px;border-right:1px solid #d7ddd2}nav button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:13px 16px;color:var(--ink);cursor:pointer;font-size:15px}nav button.active,nav button:hover{background:var(--green);color:white}main{padding:30px;max-width:1150px;width:100%}h2{font:normal 32px Georgia,serif;margin:0 0 12px}h3{font:normal 23px Georgia,serif}.muted{color:#69786f}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:25px 0}.card,.panel{background:white;border:1px solid #e1e4dc;border-radius:12px;padding:20px;box-shadow:0 3px 12px #163a2e0a}.card strong{display:block;font-size:29px;color:var(--green)}.panel{margin:16px 0}.primary,button.action{background:var(--green);color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer}.secondary{background:white;border:1px solid #b7c4b9;border-radius:7px;padding:10px 14px;color:var(--green);cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d6b66c;outline-offset:2px}input,select,textarea{padding:10px;border:1px solid #bccac0;border-radius:7px;max-width:100%;font:inherit}input[type=range]{width:100%}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}.item{padding:15px 0;border-bottom:1px solid #e7e9e3}.item:last-child{border:0}.tag{font-size:12px;background:#edf3ed;color:#38634b;padding:4px 9px;border-radius:30px}.warning{background:#fff7df;padding:12px;border-radius:8px;margin:18px 0;color:#705a24}audio{max-width:100%}footer{padding:15px 5%;color:#65766b;font-size:12px}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{padding:8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{padding:20px}header h1{font-size:29px}.notes{display:none}}</style></head><body>
<header><div><div style="color:var(--gold);letter-spacing:3px;font-size:12px">WILHELM-VON-HUMBOLDT-SCHULE</div><h1>Unser Schulchor</h1><p>Gemeinsam singen. Auch wenn wir nicht im selben Raum sind.</p></div><div class="notes">♫ ♪ ♬</div></header><div class="layout"><aside><nav id="nav"></nav><p class="muted" style="font-size:12px;padding:14px">Lokaler Testbetrieb · ohne Microsoft-Anmeldung</p></aside><main><div class="row" style="justify-content:flex-end"><label>Ansicht: <select id="role"><option value="teacher">Frau Nolte (Lehrkraft)</option><option value="student">Schüler/in</option></select></label></div><div id="view"></div></main></div><footer>WvH Schulchor · Technischer Prototyp · Keine echten Schülerdaten verwenden</footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=(k,v)=>localStorage.setItem('wvh_v2_'+k,JSON.stringify(v));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('wvh_v2_'+k))??d}catch{return d}};
let projects=load('projects',[{id:1,name:'Winter Wonderland',group:'Schulchor',desc:'Unser erstes Testlied. Mit Kopfhörern und möglichst ruhiger Umgebung aufnehmen.'}]);
if(!projects.some(p=>p.name.toLowerCase()==='winter wonderland')){projects.unshift({id:1,name:'Winter Wonderland',group:'Schulchor',desc:'Unser erstes Testlied. Mit Kopfhörern und möglichst ruhiger Umgebung aufnehmen.'});save('projects',projects)}
let recordings=[],page='dashboard',recorder=null,stream=null,chunks=[],ctx=null,playing=[],selectedDevice='',currentPreview=null;
let dbPromise=new Promise((resolve,reject)=>{let req=indexedDB.open('wvh_chor_local_v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('recordings',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function dbPut(r){let db=await dbPromise;return new Promise((ok,no)=>{let tx=db.transaction('recordings','readwrite');tx.objectStore('recordings').put({id:r.id,name:r.name,project:r.project,blob:r.blob,approved:r.approved,created:r.created});tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
async function dbAll(){let db=await dbPromise;return new Promise((ok,no)=>{let q=db.transaction('recordings').objectStore('recordings').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function dbDelete(id){let db=await dbPromise;return new Promise((ok,no)=>{let tx=db.transaction('recordings','readwrite');tx.objectStore('recordings').delete(id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function notice(){return '<div class="warning"><b>Testbetrieb:</b> Keine echte Microsoft-Anmeldung. Aufnahmen bleiben nur auf diesem Gerät in diesem Browser gespeichert und werden nicht an die Lehrkraft übertragen. Bitte keine fremden Schüleraufnahmen verwenden.</div>'}
function nav(){let teacher=$('role').value==='teacher';let menu=teacher?[['dashboard','Übersicht'],['projects','Lieder'],['record','Aufnehmen'],['submissions','Aufnahmen'],['studio','Tonstudio']]:[['dashboard','Mein Chor'],['projects','Mein Lied'],['record','Einsingen'],['submissions','Meine Aufnahmen']];$('nav').innerHTML=menu.map(([id,name])=>`<button class="${page===id?'active':''}" data-page="${id}">${name}</button>`).join('');if(!menu.some(x=>x[0]===page))page='dashboard'}
function render(){nav();let teacher=$('role').value==='teacher',h='';
if(page==='dashboard')h=`<h2>${teacher?'Guten Tag, Frau Nolte!':'Willkommen im Schulchor!'}</h2><p class="muted">Unser erstes Lied: <b>Winter Wonderland</b></p><div class="cards"><div class="card"><strong>${projects.length}</strong>Lieder</div><div class="card"><strong>${recordings.length}</strong>Aufnahmen auf diesem Gerät</div></div><div class="panel"><h3>${teacher?'Aufnahmen testen':'Bereit zum Einsingen?'}</h3><p>${teacher?'Mit Testaufnahmen kannst du die Mischung ausprobieren.':'Wähle dein Mikrofon, sing deine Stimme ein und höre sie an.'}</p><button class="primary" data-go="record">${teacher?'Aufnahme starten':'Jetzt einsingen'}</button></div>${notice()}`;
if(page==='projects')h=`<h2>Unsere Lieder</h2><div class="panel">${projects.map(p=>`<div class="item"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><span class="tag">${esc(p.group)}</span> <button class="secondary" data-go="record">Einsingen</button></div>`).join('')}</div>${teacher?'<div class="panel"><h3>Weiteres Lied anlegen</h3><form id="projectForm"><input name="name" required placeholder="Liedtitel"><button class="primary">Hinzufügen</button></form></div>':''}<p class="muted">Noten und Begleitmusik können später nach Freigabe der Rechte ergänzt werden.</p>`;
if(page==='record')h=`<h2>Deine Stimme einsingen</h2><p class="muted">Am besten mit Kopfhörern aufnehmen. Wähle erst dein Mikrofon und mache einen kurzen Test.</p><div class="panel"><label for="recProject">Lied</label><div class="row"><select id="recProject">${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><label for="mic">Mikrofon</label><div class="row"><select id="mic"><option value="">Standardmikrofon</option></select><button class="secondary" id="refreshMic">Mikrofone anzeigen</button></div><p id="micStatus" class="muted">Zum Anzeigen der Mikrofone musst du den Zugriff erlauben.</p><div class="row"><button class="secondary" id="testMic">Mikrofon testen (3 Sekunden)</button></div><p id="testStatus" class="muted"></p><hr style="border:0;border-top:1px solid #e5e9e2;margin:20px 0"><div class="row"><button class="primary" id="startRec">● Aufnahme starten</button><button class="secondary" id="stopRec" disabled>■ Aufnahme beenden</button></div><p id="recStatus" role="status" class="muted">Bereit.</p><div id="preview"></div></div>${notice()}`;
if(page==='submissions')h=`<h2>${teacher?'Aufnahmen':'Meine Aufnahmen'}</h2><p class="muted">Die Aufnahmen werden nur in diesem Browser gespeichert.</p><div class="panel">${recordings.length?recordings.map(r=>`<div class="item"><b>${esc(r.name)}</b> · ${esc(r.project)} <span class="tag">${r.approved?'Markiert':'Lokal gespeichert'}</span><div class="row"><audio controls preload="metadata" src="${r.url}"></audio><button class="secondary" data-download="${r.id}">Herunterladen</button>${teacher?`<button class="secondary" data-approve="${r.id}">${r.approved?'Markierung entfernen':'Markieren'}</button>`:''}<button class="secondary" data-delete="${r.id}">Löschen</button></div></div>`).join(''):'Noch keine Aufnahme. Öffne „Einsingen“.'}</div>${notice()}`;
if(page==='studio')h=`<h2>Tonstudio</h2><p class="muted">Mehrere Stimmen gleichzeitig starten, Lautstärken regeln und eine gemeinsame WAV-Datei exportieren.</p><div class="panel"><h3>Stimmen</h3>${recordings.length?recordings.map(r=>`<div class="item"><b>${esc(r.name)}</b> <span class="muted">${esc(r.project)}</span><div class="row"><label for="vol${r.id}">Lautstärke</label><input id="vol${r.id}" type="range" min="0" max="150" value="80" data-volume="${r.id}"><span id="label${r.id}">80 %</span></div></div>`).join(''):'Nimm zuerst mindestens eine Stimme auf.'}<div class="row"><button class="primary" id="playMix" ${recordings.length?'':'disabled'}>▶ Gemeinsam anhören</button><button class="secondary" id="stopMix">■ Stopp</button><button class="secondary" id="exportMix" ${recordings.length?'':'disabled'}>Mix als WAV speichern</button></div><p id="mixStatus" class="muted"></p></div><div class="warning">Alle Aufnahmen beginnen derzeit gleichzeitig. Automatische Erkennung und Korrektur von Einsätzen, Rauschen und Tonhöhe sind noch nicht enthalten. Für einen sauberen Chormix brauchen wir eine gemeinsame zeitliche Referenz.</div>`;
$('view').innerHTML=h;bind()}
function bind(){document.querySelectorAll('[data-page],[data-go]').forEach(b=>b.onclick=()=>{stopMix();page=b.dataset.page||b.dataset.go;render()});if($('projectForm'))$('projectForm').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(name){projects.push({id:Date.now(),name,group:'Schulchor',desc:'Neues Chorprojekt'});save('projects',projects);render()}};if($('refreshMic'))$('refreshMic').onclick=refreshMics;if($('testMic'))$('testMic').onclick=testMic;if($('startRec'))$('startRec').onclick=startRec;if($('stopRec'))$('stopRec').onclick=stopRec;document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>{let r=recordings.find(x=>x.id===Number(b.dataset.download));if(r)download(r.blob,'Winter-Wonderland-Stimme-'+r.id+'.'+(r.blob.type.includes('mp4')?'m4a':'webm'))});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Diese Aufnahme wirklich löschen?'))return;let id=Number(b.dataset.delete);await dbDelete(id);let r=recordings.find(x=>x.id===id);if(r)URL.revokeObjectURL(r.url);recordings=recordings.filter(x=>x.id!==id);render()});document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{let r=recordings.find(x=>x.id===Number(b.dataset.approve));r.approved=!r.approved;await dbPut(r);render()});document.querySelectorAll('[data-volume]').forEach(b=>b.oninput=()=>{$('label'+b.dataset.volume).textContent=b.value+' %'});if($('playMix'))$('playMix').onclick=playMix;if($('stopMix'))$('stopMix').onclick=stopMix;if($('exportMix'))$('exportMix').onclick=exportMix}
async function refreshMics(){let status=$('micStatus');try{let s=await navigator.mediaDevices.getUserMedia({audio:true});let devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');let sel=$('mic');sel.innerHTML='<option value="">Standardmikrofon</option>'+devices.map((d,i)=>`<option value="${esc(d.deviceId)}">${esc(d.label||'Mikrofon '+(i+1))}</option>`).join('');if(selectedDevice)sel.value=selectedDevice;sel.onchange=()=>selectedDevice=sel.value;s.getTracks().forEach(t=>t.stop());status.textContent=devices.length+' Mikrofon(e) gefunden.'}catch(e){status.textContent='Mikrofonzugriff fehlgeschlagen: '+e.message}}
function constraint(){let id=$('mic')?.value||selectedDevice;return {audio:id?{deviceId:{ideal:id},echoCancellation:false,noiseSuppression:false,autoGainControl:false}:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}}
async function testMic(){let status=$('testStatus');try{let s=await navigator.mediaDevices.getUserMedia(constraint());let c=new (window.AudioContext||window.webkitAudioContext)(),source=c.createMediaStreamSource(s),an=c.createAnalyser();source.connect(an);let a=new Uint8Array(an.fftSize),peak=0;status.textContent='Bitte 3 Sekunden sprechen oder singen …';let start=performance.now();await new Promise(resolve=>{let tick=()=>{an.getByteTimeDomainData(a);let rms=Math.sqrt(a.reduce((sum,x)=>sum+(x-128)**2,0)/a.length)/128;peak=Math.max(peak,rms);if(performance.now()-start<3000)requestAnimationFrame(tick);else resolve()};tick()});s.getTracks().forEach(t=>t.stop());await c.close();status.textContent=peak>.015?'Mikrofon funktioniert! Pegel erkannt.':'Mikrofon aktiv, aber kaum Signal erkannt. Bitte Mikrofon und Lautstärke prüfen.'}catch(e){status.textContent='Test fehlgeschlagen: '+e.message}}
async function startRec(){let status=$('recStatus');try{if(!window.MediaRecorder)throw Error('Dieser Browser unterstützt keine Aufnahme.');stream=await navigator.mediaDevices.getUserMedia(constraint());chunks=[];let type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);let project=projects.find(p=>String(p.id)===$('recProject').value)||projects[0];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{try{let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(!blob.size)throw Error('Aufnahme ist leer');let r={id:Date.now(),name:'Stimme '+(recordings.length+1),project:project.name,blob,approved:false,created:new Date().toISOString(),url:URL.createObjectURL(blob)};await dbPut(r);recordings.push(r);if($('preview'))$('preview').innerHTML='<p><b>Aufnahme gespeichert!</b> Du kannst sie hier anhören oder unter „Meine Aufnahmen“ herunterladen.</p><audio controls src="'+r.url+'"></audio>';status.textContent='Aufnahme sicher in diesem Browser gespeichert.'}catch(e){status.textContent='Speichern fehlgeschlagen: '+e.message}finally{stream?.getTracks().forEach(t=>t.stop());stream=null}};recorder.start(1000);$('startRec').disabled=true;$('stopRec').disabled=false;status.textContent='● Aufnahme läuft. Sing jetzt!'}catch(e){status.textContent='Fehler: '+e.message;stream?.getTracks().forEach(t=>t.stop())}}
function stopRec(){if(recorder?.state==='recording'){recorder.stop();$('stopRec').disabled=true;$('startRec').disabled=false;$('recStatus').textContent='Aufnahme wird gespeichert …'}}
function stopMix(){playing.forEach(x=>{try{x.stop()}catch{}});playing=[]}
async function decodeAll(){let ac=ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)());await ac.resume();return Promise.all(recordings.map(async r=>ac.decodeAudioData(await r.blob.arrayBuffer())))}
function gains(){return recordings.map(r=>Number(document.querySelector('[data-volume="'+r.id+'"]')?.value||80)/100)}
async function playMix(){stopMix();try{let buffers=await decodeAll(),start=ctx.currentTime+.12,gs=gains();buffers.forEach((buffer,i)=>{let src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=buffer;g.gain.value=gs[i];src.connect(g).connect(ctx.destination);src.start(start);playing.push(src)});$('mixStatus').textContent='Mix wird abgespielt.'}catch(e){$('mixStatus').textContent='Abspielen fehlgeschlagen: '+e.message}}
function wavFromBuffer(buffer){let ch=buffer.numberOfChannels,frames=buffer.length,bytes=new ArrayBuffer(44+frames*ch*2),v=new DataView(bytes),offset=0;const str=s=>{for(let c of s)v.setUint8(offset++,c.charCodeAt(0))},u16=n=>{v.setUint16(offset,n,true);offset+=2},u32=n=>{v.setUint32(offset,n,true);offset+=4};str('RIFF');u32(36+frames*ch*2);str('WAVE');str('fmt ');u32(16);u16(1);u16(ch);u32(buffer.sampleRate);u32(buffer.sampleRate*ch*2);u16(ch*2);u16(16);str('data');u32(frames*ch*2);let data=Array.from({length:ch},(_,i)=>buffer.getChannelData(i));for(let i=0;i<frames;i++)for(let j=0;j<ch;j++){let x=Math.max(-1,Math.min(1,data[j][i]));v.setInt16(offset,x<0?x*32768:x*32767,true);offset+=2}return new Blob([bytes],{type:'audio/wav'})}
async function exportMix(){let status=$('mixStatus');try{status.textContent='Mix wird erstellt …';let buffers=await decodeAll(),rate=44100,length=Math.ceil(Math.max(...buffers.map(b=>b.duration))*rate);if(length>rate*600)throw Error('Maximal 10 Minuten pro Mix in dieser Testversion.');let offline=new OfflineAudioContext(2,length,rate),gs=gains();buffers.forEach((buffer,i)=>{let src=offline.createBufferSource(),g=offline.createGain();src.buffer=buffer;g.gain.value=gs[i]/Math.max(1,Math.sqrt(buffers.length));src.connect(g).connect(offline.destination);src.start(0)});let mixed=await offline.startRendering();download(wavFromBuffer(mixed),'Winter-Wonderland-Chormix.wav');status.textContent='WAV-Mix heruntergeladen. Bitte anhören und prüfen.'}catch(e){status.textContent='Export fehlgeschlagen: '+e.message}}
$('role').onchange=()=>{page='dashboard';render()};dbAll().then(rows=>{recordings=rows.map(r=>({...r,url:URL.createObjectURL(r.blob)}));render()}).catch(e=>{render();console.error('Lokaler Speicher nicht verfügbar',e)});
</script></body></html>
